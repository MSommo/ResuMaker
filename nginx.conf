# Serves the built React app and forwards /api to the FastAPI container (used by the frozen and scratch stacks).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 5m;                 # a CV is a few hundred KB of JSON at most

    # Browser hardening for every response (nginx drops a parent's add_header when a location sets its own, so these are
    # repeated below). Scripts only from us; styles/fonts also from Google Fonts (index.html); nothing may frame the app.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Resolve `api` at request time, so restarting the api container doesn't leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8100;
        proxy_pass $api;                      # with a variable and no URI part, the original request URI is passed through
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;     # with the port: the API compares it with the browser's Origin header (CSRF check)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;              # AI calls and PDF rendering can take a while
        client_max_body_size 12m;             # CV import uploads (the API itself enforces 10 MB)
        proxy_buffering off;                  # the assistant streams progress as Server-Sent Events: pass chunks through immediately
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/p/<id>, /editor/<id>, …) are handled by the client router.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
