# ResuMaker, SCRATCH stack: a throwaway copy for testing work in progress. `make stack`  →  http://localhost:5180
#
# Completely separate from the frozen stack (docker-compose.stable.yml), which holds your real data:
#   • its own project name, containers, network and database volume (so migrations here can never touch real data)
#   • its own host ports (web 5180, api 8180, postgres 5434, redis 6381)
#   • images are built from the working tree and run as-is: NO bind mounts and NO hot reload
#     (opt in with `make stack HOT=1`, which layers docker-compose.hot.yml on top)
# Throw it away completely with `make scratch-reset`.
name: resumaker-scratch

x-api-env: &api-env
  env_file:
    - path: .env            # GEMINI_API_KEY lives here; optional so a fresh clone still starts (AI is simply off)
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://resumaker:resumaker@db:5432/resumaker
    REDIS_URL: redis://redis:6379/0
    FRONTEND_URL: http://web      # headless Chrome in the api container loads the app from nginx to render PDFs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resumaker
      POSTGRES_PASSWORD: resumaker   # local development only
      POSTGRES_DB: resumaker
    ports:
      - "127.0.0.1:5434:5432"        # for host tools; containers use db:5432
    volumes:
      - scratch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumaker -d resumaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only: no persistence needed
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api-env
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "127.0.0.1:${API_PORT:-8180}:8100"
    shm_size: 1gb                      # Chrome needs more than Docker's default 64MB /dev/shm
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/status')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.static   # the built app served by nginx, same as the frozen stack
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MCP server (stdio), launched on demand:  docker compose run --rm -T mcp
  mcp:
    <<: *api-env
    build: ./backend
    profiles: ["mcp"]
    command: ["python", "-m", "app.mcp_server"]
    stdin_open: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  scratch-pgdata:
