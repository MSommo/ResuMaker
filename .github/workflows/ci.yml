name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── React frontend ─────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Known vulnerabilities in dependencies ──────────────────
  audit:
    name: Dependency audit (npm + pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Everything, dev tools included: a compromised test runner or bundler runs on developer machines and in this CI.
      - name: npm audit
        run: npm audit --audit-level=moderate

      - uses: astral-sh/setup-uv@v5

      # The exact versions in uv.lock (what the API image installs), checked against the PyPI advisory database.
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  # ── Python backend ─────────────────────────────────────────
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest

    # The suite needs a real Postgres (with pgvector) and Redis, same images as docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resumaker
          POSTGRES_PASSWORD: resumaker
          POSTGRES_DB: resumaker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U resumaker -d resumaker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    # The service containers above publish these ports on the runner (the same ones as the local scratch stack).
    env:
      APP_HOST: localhost
      SCRATCH_PG_PORT: 5434
      SCRATCH_REDIS_PORT: 6381

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # The live-Gemini evals are excluded by the pytest config (-m 'not live'); the API key is a dummy.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://resumaker:resumaker@${{ env.APP_HOST }}:${{ env.SCRATCH_PG_PORT }}/resumaker
          REDIS_URL: redis://${{ env.APP_HOST }}:${{ env.SCRATCH_REDIS_PORT }}/0
        run: uv run pytest -q
