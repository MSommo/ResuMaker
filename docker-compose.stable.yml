# ResuMaker, FROZEN stack: the stable build, with your real data.
#
# It only references pre-built, tagged images (`make stable-build`), so `docker compose up` can never rebuild it from the
# working tree, and there are no bind mounts: editing files in this repo cannot change what is running here.
# Same project name and volume as the earlier dev stack, so your database carries over unchanged.
#
#   make stable-build   # build images from a git tag (default: stable), not from the working tree
#   make stable-up      # start / update the frozen stack
name: resumaker

x-api: &api
  image: resumaker-api:${STABLE_TAG:-stable}
  env_file:
    - path: .env            # GEMINI_API_KEY; optional (AI is simply off without it)
      required: false
  environment: &api-environment
    DATABASE_URL: postgresql+asyncpg://resumaker:resumaker@db:5432/resumaker
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: ${PUBLIC_URL:-http://${APP_HOST:-localhost}:${STABLE_WEB_PORT:-5174}}   # what people open in a browser: used in invite links
    API_HOST: 0.0.0.0             # the image's CMD runs uvicorn on :8100 (PORT), trusting proxy headers only from private addresses (nginx)
    FRONTEND_URL: http://web:8080  # headless Chrome loads the app from nginx to render PDFs

services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (memory). Debian-based: it uses its own volume, see below.
    container_name: resumaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumaker
      POSTGRES_PASSWORD: resumaker   # local use only
      POSTGRES_DB: resumaker
    ports:
      - "127.0.0.1:${STABLE_PG_PORT:-5433}:5432"
    volumes:
      - resumaker-pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumaker -d resumaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resumaker-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${STABLE_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api
    container_name: resumaker-api
    restart: unless-stopped
    # The image's own command: no --reload; --proxy-headers so the sign-in limit sees the client address nginx passes on.
    ports:
      - "127.0.0.1:${STABLE_API_PORT:-8100}:8100"
    shm_size: 1gb
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/status')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: resumaker-web:${STABLE_TAG:-stable}
    container_name: resumaker-web
    restart: unless-stopped
    ports:
      # Only the web port can be exposed to the LAN (STABLE_BIND=0.0.0.0, see `make stable-expose`). The API, Postgres and
      # Redis stay on localhost; the API is reachable through nginx at /api.
      - "${STABLE_BIND:-127.0.0.1}:${STABLE_WEB_PORT:-5174}:8080"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MCP server (stdio), launched on demand:  docker compose -f docker-compose.stable.yml run --rm -T mcp
  mcp:
    <<: *api
    profiles: ["mcp"]
    command: ["python", "-m", "app.mcp_server"]
    environment:
      <<: *api-environment                    # (a service's own `environment` replaces the merged one, so merge it back in)
      RESUMAKER_TOKEN: ${RESUMAKER_TOKEN:-}   # who the server acts as: `make mcp-token LOGIN=you@example.com`
    stdin_open: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  resumaker-pgdata-v2:    # => resumaker_resumaker-pgdata-v2: the live data (restored from the stable-1 dump on the pgvector image)
  resumaker-pgdata:       # => resumaker_resumaker-pgdata: the OLD alpine volume, untouched, kept as a rollback. Delete it once you are happy.
