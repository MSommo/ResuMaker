# Browser hardening for every response. Included in the server block AND in every location that sets its own add_header
# (nginx drops the inherited add_header directives as soon as a location defines one).
#
# Scripts only from us; styles/fonts also from Google Fonts (index.html); nothing may frame the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HTTPS only from now on. Browsers ignore this header on plain http (RFC 6797 §8.1), so it is harmless on the local stacks;
# behind Railway's TLS it takes effect. No includeSubDomains/preload: a custom domain's other subdomains aren't ours to pin.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
