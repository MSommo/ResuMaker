# Used by the `alembic` CLI (see `make migration`). The URL comes from app settings in migrations/env.py.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
