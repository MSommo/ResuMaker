[project]
name = "resumaker-api"
version = "0.1.0"
description = "ResuMaker backend: FastAPI + LangGraph agent + MCP server, on Postgres and Redis"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "grandalf>=0.8",
    "httpx>=0.28.1",
    "langgraph>=1.2.23",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "playwright>=1.65.2",
    "psycopg[binary,pool]>=3.3.9",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.16.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (needs a real GEMINI_API_KEY); run with `make eval-router`"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
